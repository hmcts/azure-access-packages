name: "Database-one-day-access-with-approval"
policy:
  display_name: "Initial Policy"
  description: "Initial Policy"
  duration_in_days: 1
  extension_enabled: false
  approval_settings:
    approval_required_for_extension: false
    approval_required: true
    approval_stage:
      approval_timeout_in_days: 1
      approver_justification_required: false
      enable_alternative_approval_in_days: 0
      primary_approver:
        subject_type: "groupMembers"
    requestor_justification_required: true
  assignment_review_settings:
    enabled: false
  questions:
  - required: true
    sequence: 0
    text:
      default_text: "Jira / Halo link"
  requestor_settings:
    requestor:
      subject_type: "groupMembers"
    requests_accepted: true
    scope_type: "SpecificDirectorySubjects"
