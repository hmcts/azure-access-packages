name: access-packages
trigger:
  batch: true
  branches:
    include:
      - master

resources:
  repositories:
    - repository: cnp-azuredevops-libraries
      type: github
      ref: refs/heads/master
      name: hmcts/cnp-azuredevops-libraries
      endpoint: "hmcts"

pool:
  vmImage: "ubuntu-latest"

parameters:
  - name: action
    displayName: Action
    type: string
    default: plan
    values:
      - plan
      - apply

  - name: location
    displayName: Location
    type: string
    default: "UK South"
    values:
      - "UK South"

  - name: overrideAction
    type: string
    default: plan
    values:
      - plan
      - apply
      - destroy

variables:
  - name: timeoutInMinutes
    value: 60
  - name: project
    value: "access-packages"
  - name: product
    value: "sds-platform"
  - name: terraformInitSubscription
    value: "04d27a32-7a07-48b3-95b8-3c8691e1a263"
  - name: serviceConnection
    value: DTS-SHAREDSERVICES-PROD
  - name: action
    value: ${{ parameters.action }}
  - template: vars/input-variables.yaml@cnp-azuredevops-libraries
  - name: environment
    value: prod
  - name: storageAccountEnv
    value: prod
  - name: terraformSubscriptionID
    value: "5ca62022-6aa2-4cee-aaa7-e7536c8d566c"
  - name: tenant_id
    value: "531ff96d-0ae9-462a-8d2d-bec7c0b42082"
  - name: client_id
    value: "5a03bb64-bdac-4187-b9c4-8936e3809656"

stages:
  - stage: Precheck
    jobs:
      - job:
        timeoutInMinutes: ${{ variables.timeoutInMinutes }}
        steps:
          - template: steps/terraform-precheck.yaml@cnp-azuredevops-libraries
            parameters:
              keyvaultName: "infra-vault-nonprod"
              keyvaultSecret: "azure-devops-sp-token"
              serviceConnection: "DCD-CFT-Sandbox"
              overrideAction: ${{ parameters.overrideAction }}

  - stage: deploy
    dependsOn: Precheck
    jobs:
      - job: PlanAndApply
        steps:
          - task: AzureKeyVault@1
            displayName: "Get Secrets from Keyvault"
            inputs:
              azureSubscription: ${{ variables.serviceConnection }}
              connectedServiceName: ${{ variables.serviceConnection }}
              keyVaultName: central-app-reg-kv
              secretsFilter: "access-packages-secret"

          - task: Bash@3
            displayName: "Verify Graph token claims"
            env:
              CLIENT_ID: ${{ variables.client_id }}
              CLIENT_SECRET: $(access-packages-secret)
              TENANT_ID: ${{ variables.tenant_id }}
            inputs:
              targetType: inline
              script: |
                set -euo pipefail

                response=$(curl -sS -X POST "https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token" \
                  -H "Content-Type: application/x-www-form-urlencoded" \
                  --data-urlencode "client_id=${CLIENT_ID}" \
                  --data-urlencode "client_secret=${CLIENT_SECRET}" \
                  --data-urlencode "scope=https://graph.microsoft.com/.default" \
                  --data-urlencode "grant_type=client_credentials")

                python3 - "$response" <<'PY'
                import base64
                import json
                import os
                import sys

                data = json.loads(sys.argv[1])
                token = data.get("access_token")
                if not token:
                    print("Token request failed:", data.get("error"), data.get("error_description"))
                    sys.exit(1)

                payload = token.split(".")[1]
                payload += "=" * (-len(payload) % 4)
                claims = json.loads(base64.urlsafe_b64decode(payload))
                app_id = claims.get("appid") or claims.get("azp")
                roles = claims.get("roles", [])

                print("appid:", app_id)
                print("tid:", claims.get("tid"))
                print("roles:", roles)

                expected = os.environ["CLIENT_ID"]
                if app_id != expected:
                    sys.exit(f"Wrong app id in token, expected {expected}")
                if "EntitlementManagement.ReadWrite.All" not in roles:
                    sys.exit("Missing EntitlementManagement.ReadWrite.All in token roles")

                def graph_request(method, path, body=None):
                    import urllib.error
                    import urllib.parse
                    import urllib.request

                    url = "https://graph.microsoft.com/v1.0/" + urllib.parse.quote(path, safe="/?$=&(),")
                    data = None
                    headers = {"Authorization": f"Bearer {token}"}
                    if body is not None:
                        data = json.dumps(body).encode("utf-8")
                        headers["Content-Type"] = "application/json"
                    request = urllib.request.Request(
                        url,
                        data=data,
                        headers=headers,
                        method=method,
                    )
                    try:
                        with urllib.request.urlopen(request) as response:
                            response_body = response.read().decode("utf-8")
                            return response.status, json.loads(response_body) if response_body else {}
                    except urllib.error.HTTPError as error:
                        response_body = error.read().decode("utf-8")
                        print(f"Graph {method} {path} failed with {error.code}:")
                        print(response_body)
                        return error.code, json.loads(response_body) if response_body else {}

                def graph_get(path):
                    status, body = graph_request("GET", path)
                    if status >= 400:
                        sys.exit(f"Graph GET failed for {path}")
                    return body

                service_principals = graph_get(
                    f"servicePrincipals?$filter=appId eq '{expected}'&$select=id,displayName,appId"
                ).get("value", [])
                if not service_principals:
                    sys.exit("Could not find service principal for app id")

                service_principal = service_principals[0]
                service_principal_id = service_principal["id"]
                print("servicePrincipalObjectId:", service_principal_id)
                print("servicePrincipalDisplayName:", service_principal.get("displayName"))

                catalogs = graph_get(
                    "identityGovernance/entitlementManagement/catalogs?$filter=displayName eq 'Databases'&$select=id,displayName"
                ).get("value", [])
                if catalogs:
                    print("databasesCatalogId:", catalogs[0]["id"])
                else:
                    print("databasesCatalogId: not found")

                role_assignments = graph_get(
                    "roleManagement/entitlementManagement/roleAssignments?"
                    f"$filter=principalId eq '{service_principal_id}'&"
                    "$expand=roleDefinition&$select=id,appScopeId,roleDefinition"
                ).get("value", [])
                print("entitlementRoleAssignments:", json.dumps(role_assignments, indent=2))

                packages = graph_get(
                    "identityGovernance/entitlementManagement/accessPackages?"
                    "$filter=displayName eq 'Database - RD write access - 2 Hours'&"
                    "$select=id,displayName"
                ).get("value", [])
                if not packages:
                    sys.exit("RD write access package not found for raw Graph policy diagnostic")

                package_id = packages[0]["id"]
                print("rdWriteAccessPackageId:", package_id)

                diagnostic_policy = {
                    "displayName": "diagnostic-policy-delete-me",
                    "description": "Temporary policy created by pipeline diagnostics",
                    "allowedTargetScope": "notSpecified",
                    "specificAllowedTargets": [],
                    "expiration": {
                        "endDateTime": None,
                        "duration": None,
                        "type": "noExpiration",
                    },
                    "requestorSettings": {
                        "enableTargetsToSelfAddAccess": False,
                        "enableTargetsToSelfUpdateAccess": False,
                        "enableTargetsToSelfRemoveAccess": False,
                        "allowCustomAssignmentSchedule": True,
                        "enableOnBehalfRequestorsToAddAccess": False,
                        "enableOnBehalfRequestorsToUpdateAccess": False,
                        "enableOnBehalfRequestorsToRemoveAccess": False,
                        "onBehalfRequestors": [],
                    },
                    "requestApprovalSettings": {
                        "isApprovalRequiredForAdd": False,
                        "isApprovalRequiredForUpdate": False,
                        "stages": [],
                    },
                    "accessPackage": {
                        "id": package_id,
                    },
                }

                status, created_policy = graph_request(
                    "POST",
                    "identityGovernance/entitlementManagement/assignmentPolicies",
                    diagnostic_policy,
                )
                if status >= 400:
                    sys.exit("Raw Graph diagnostic policy create failed")

                created_policy_id = created_policy["id"]
                print("rawGraphDiagnosticPolicyCreate: success")
                print("rawGraphDiagnosticPolicyId:", created_policy_id)

                delete_status, _ = graph_request(
                    "DELETE",
                    f"identityGovernance/entitlementManagement/assignmentPolicies/{created_policy_id}",
                )
                if delete_status >= 400:
                    sys.exit("Raw Graph diagnostic policy delete failed")
                print("rawGraphDiagnosticPolicyDelete: success")

                def group_id(display_name):
                    groups = graph_get(
                        f"groups?$filter=displayName eq '{display_name}'&$select=id,displayName"
                    ).get("value", [])
                    if not groups:
                        sys.exit(f"Group not found: {display_name}")
                    print(f"groupId:{display_name}:", groups[0]["id"])
                    return groups[0]["id"]

                requestor_group_id = group_id("DTS CFT SC")
                approver_group_id = group_id("DTS RD Admins")

                terraform_like_policy = {
                    "displayName": "diagnostic-rd-write-policy-delete-me",
                    "description": "Temporary policy created by pipeline diagnostics",
                    "allowedTargetScope": "specificDirectoryUsers",
                    "specificAllowedTargets": [
                        {
                            "@odata.type": "#microsoft.graph.groupMembers",
                            "groupId": requestor_group_id,
                        }
                    ],
                    "expiration": {
                        "duration": "PT2H",
                        "type": "afterDuration",
                    },
                    "requestorSettings": {
                        "enableTargetsToSelfAddAccess": True,
                        "enableTargetsToSelfUpdateAccess": False,
                        "enableTargetsToSelfRemoveAccess": True,
                        "allowCustomAssignmentSchedule": False,
                        "enableOnBehalfRequestorsToAddAccess": False,
                        "enableOnBehalfRequestorsToUpdateAccess": False,
                        "enableOnBehalfRequestorsToRemoveAccess": False,
                        "onBehalfRequestors": [],
                    },
                    "requestApprovalSettings": {
                        "isApprovalRequiredForAdd": True,
                        "isApprovalRequiredForUpdate": False,
                        "isRequestorJustificationRequired": True,
                        "stages": [
                            {
                                "durationBeforeAutomaticDenial": "P1D",
                                "isApproverJustificationRequired": False,
                                "isEscalationEnabled": False,
                                "durationBeforeEscalation": "PT0S",
                                "primaryApprovers": [
                                    {
                                        "@odata.type": "#microsoft.graph.groupMembers",
                                        "groupId": approver_group_id,
                                    }
                                ],
                                "fallbackPrimaryApprovers": [],
                                "escalationApprovers": [],
                                "fallbackEscalationApprovers": [],
                            }
                        ],
                    },
                    "questions": [
                        {
                            "@odata.type": "#microsoft.graph.accessPackageTextInputQuestion",
                            "isRequired": True,
                            "isAnswerEditable": True,
                            "sequence": 0,
                            "text": "Halo ID (include all changes being executed)",
                        }
                    ],
                    "accessPackage": {
                        "id": package_id,
                    },
                }

                status, created_policy = graph_request(
                    "POST",
                    "identityGovernance/entitlementManagement/assignmentPolicies",
                    terraform_like_policy,
                )
                if status >= 400:
                    sys.exit("Raw Graph Terraform-like policy create failed")

                created_policy_id = created_policy["id"]
                print("rawGraphTerraformLikePolicyCreate: success")
                print("rawGraphTerraformLikePolicyId:", created_policy_id)

                delete_status, _ = graph_request(
                    "DELETE",
                    f"identityGovernance/entitlementManagement/assignmentPolicies/{created_policy_id}",
                )
                if delete_status >= 400:
                    sys.exit("Raw Graph Terraform-like policy delete failed")
                print("rawGraphTerraformLikePolicyDelete: success")
                PY

          - template: steps/terraform.yaml@cnp-azuredevops-libraries
            parameters:
              location: ${{ parameters.location }}
              serviceConnection: ${{ variables.serviceConnection }}
              product: ${{ variables.product }}
              overrideAction: ${{ parameters.overrideAction }}
              environment: ${{ variables.environment }}
              component: "access-packages"
              terraformInitSubscription: ${{ variables.terraformInitSubscription }}
              tfVarsFile: NULL
              terraformEnvironmentVariables:
                ARM_CLIENT_ID: ${{ variables.client_id }}
                ARM_CLIENT_SECRET: $(access-packages-secret)
                ARM_TENANT_ID: ${{ variables.tenant_id }}
                ARM_USE_CLI: "false"
              initCommandOptions: >
                -reconfigure
                -var subscription_id=${{ variables.terraformSubscriptionID }}
              planCommandOptions: >
                -var subscription_id=${{ variables.terraformSubscriptionID }}
                -var env=${{ variables.environment }}
                -var client_id=${{ variables.client_id }}
                -var client_secret=$(access-packages-secret)
                -var tenant_id=${{ variables.tenant_id }}
