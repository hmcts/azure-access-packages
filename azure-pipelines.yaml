name: access-packages
trigger:
  batch: true
  branches:
    include:
      - master

resources:
  repositories:
    - repository: cnp-azuredevops-libraries
      type: github
      ref: refs/heads/master
      name: hmcts/cnp-azuredevops-libraries
      endpoint: "hmcts"

pool:
  vmImage: "ubuntu-latest"

parameters:
  - name: action
    displayName: Action
    type: string
    default: plan
    values:
      - plan
      - apply

  - name: location
    displayName: Location
    type: string
    default: "UK South"
    values:
      - "UK South"

  - name: overrideAction
    type: string
    default: plan
    values:
      - plan
      - apply
      - destroy

variables:
  - name: timeoutInMinutes
    value: 60
  - name: project
    value: "access-packages"
  - name: product
    value: "sds-platform"
  - name: terraformInitSubscription
    value: "04d27a32-7a07-48b3-95b8-3c8691e1a263"
  - name: serviceConnection
    value: DTS-SHAREDSERVICES-PROD
  - name: action
    value: ${{ parameters.action }}
  - template: vars/input-variables.yaml@cnp-azuredevops-libraries
  - name: environment
    value: prod
  - name: storageAccountEnv
    value: prod
  - name: terraformSubscriptionID
    value: "5ca62022-6aa2-4cee-aaa7-e7536c8d566c"
  - name: tenant_id
    value: "531ff96d-0ae9-462a-8d2d-bec7c0b42082"
  - name: client_id
    value: "5a03bb64-bdac-4187-b9c4-8936e3809656"

stages:
  - stage: Precheck
    jobs:
      - job:
        timeoutInMinutes: ${{ variables.timeoutInMinutes }}
        steps:
          - template: steps/terraform-precheck.yaml@cnp-azuredevops-libraries
            parameters:
              keyvaultName: "infra-vault-nonprod"
              keyvaultSecret: "azure-devops-sp-token"
              serviceConnection: "DCD-CFT-Sandbox"
              overrideAction: ${{ parameters.overrideAction }}

  - stage: deploy
    dependsOn: Precheck
    jobs:
      - job: PlanAndApply
        steps:
          - task: AzureKeyVault@1
            displayName: "Get Secrets from Keyvault"
            inputs:
              azureSubscription: ${{ variables.serviceConnection }}
              connectedServiceName: ${{ variables.serviceConnection }}
              keyVaultName: central-app-reg-kv
              secretsFilter: "access-packages-secret"

          - task: Bash@3
            displayName: "CLI test beta RD policy body"
            env:
              CLIENT_ID: ${{ variables.client_id }}
              CLIENT_SECRET: $(access-packages-secret)
              TENANT_ID: ${{ variables.tenant_id }}
            inputs:
              targetType: inline
              script: |
                set -euo pipefail

                az login \
                  --service-principal \
                  --username "${CLIENT_ID}" \
                  --password "${CLIENT_SECRET}" \
                  --tenant "${TENANT_ID}" \
                  --allow-no-subscriptions \
                  --output none

                rd_package_id=$(az rest \
                  --method get \
                  --url "https://graph.microsoft.com/v1.0/identityGovernance/entitlementManagement/accessPackages?\$filter=displayName%20eq%20'Database%20-%20RD%20write%20access%20-%202%20Hours'&\$select=id,displayName" \
                  --query "value[0].id" \
                  --output tsv)

                requestor_group_id=$(az rest \
                  --method get \
                  --url "https://graph.microsoft.com/v1.0/groups?\$filter=displayName%20eq%20'DTS%20CFT%20SC'&\$select=id,displayName" \
                  --query "value[0].id" \
                  --output tsv)

                approver_group_id=$(az rest \
                  --method get \
                  --url "https://graph.microsoft.com/v1.0/groups?\$filter=displayName%20eq%20'DTS%20RD%20Admins'&\$select=id,displayName" \
                  --query "value[0].id" \
                  --output tsv)

                if [ -z "${rd_package_id}" ] || [ -z "${requestor_group_id}" ] || [ -z "${approver_group_id}" ]; then
                  echo "Missing id for package/requestor/approver"
                  echo "rd_package_id=${rd_package_id}"
                  echo "requestor_group_id=${requestor_group_id}"
                  echo "approver_group_id=${approver_group_id}"
                  exit 1
                fi

                echo "rdWriteAccessPackageId: ${rd_package_id}"
                echo "requestorGroupId: ${requestor_group_id}"
                echo "approverGroupId: ${approver_group_id}"

                graph_token=$(az account get-access-token \
                  --resource https://graph.microsoft.com \
                  --query accessToken \
                  --output tsv)

                run_id="${BUILD_BUILDID:-manual}-$(date +%s)"
                beta_url="https://graph.microsoft.com/beta/identityGovernance/entitlementManagement/accessPackageAssignmentPolicies"

                try_beta_policy() {
                  label="$1"
                  body="$2"

                  echo "---- betaPolicyTest: ${label} ----"
                  response=$(curl -sS \
                    --request POST \
                    --url "${beta_url}" \
                    --header "Authorization: Bearer ${graph_token}" \
                    --header "Content-Type: application/json" \
                    --data "${body}" \
                    --write-out "\n%{http_code}")

                  status=$(printf '%s\n' "${response}" | tail -n 1)
                  response_body=$(printf '%s\n' "${response}" | sed '$d')

                  echo "status: ${status}"
                  if [ "${status}" -ge 200 ] && [ "${status}" -lt 300 ]; then
                    created_policy_id=$(printf '%s' "${response_body}" | jq -r '.id // empty')
                    echo "result: success"
                    echo "policyId: ${created_policy_id}"

                    if [ -n "${created_policy_id}" ]; then
                      delete_status=$(curl -sS \
                        --request DELETE \
                        --url "${beta_url}/${created_policy_id}" \
                        --header "Authorization: Bearer ${graph_token}" \
                        --output /tmp/beta-policy-delete-response.json \
                        --write-out "%{http_code}")
                      echo "deleteStatus: ${delete_status}"
                    fi
                  else
                    echo "result: failure"
                    printf '%s\n' "${response_body}"
                  fi
                }

                provider_style_body=$(jq -n \
                  --arg packageId "${rd_package_id}" \
                  --arg approverGroupId "${approver_group_id}" \
                  --arg runId "${run_id}" \
                  '{
                    accessPackageId: $packageId,
                    displayName: ("diag-beta-provider-style-" + $runId),
                    description: "Temporary beta policy diagnostic",
                    expiration: {
                      duration: "P90D",
                      type: "afterDuration"
                    },
                    requestorSettings: {
                      scopeType: "AllExistingDirectoryMemberUsers"
                    },
                    requestApprovalSettings: {
                      isApprovalRequired: true,
                      approvalStages: [
                        {
                          approvalStageTimeOutInDays: 14,
                          primaryApprovers: [
                            {
                              "@odata.type": "#microsoft.graph.groupMembers",
                              groupId: $approverGroupId,
                              description: "DTS RD Admins"
                            }
                          ]
                        }
                      ]
                    }
                  }')

                specific_p1d_no_question_body=$(jq -n \
                  --arg packageId "${rd_package_id}" \
                  --arg requestorGroupId "${requestor_group_id}" \
                  --arg approverGroupId "${approver_group_id}" \
                  --arg runId "${run_id}" \
                  '{
                    accessPackageId: $packageId,
                    displayName: ("diag-beta-specific-p1d-" + $runId),
                    description: "Temporary beta policy diagnostic",
                    expiration: {
                      duration: "P1D",
                      type: "afterDuration"
                    },
                    requestorSettings: {
                      scopeType: "SpecificDirectorySubjects",
                      acceptRequests: true,
                      allowedRequestors: [
                        {
                          "@odata.type": "#microsoft.graph.groupMembers",
                          groupId: $requestorGroupId
                        }
                      ]
                    },
                    requestApprovalSettings: {
                      isApprovalRequired: true,
                      isApprovalRequiredForExtension: false,
                      isRequestorJustificationRequired: true,
                      approvalStages: [
                        {
                          approvalStageTimeOutInDays: 1,
                          isApproverJustificationRequired: false,
                          isEscalationEnabled: false,
                          primaryApprovers: [
                            {
                              "@odata.type": "#microsoft.graph.groupMembers",
                              groupId: $approverGroupId
                            }
                          ]
                        }
                      ]
                    }
                  }')

                specific_pt2h_no_question_body=$(printf '%s' "${specific_p1d_no_question_body}" | jq \
                  --arg runId "${run_id}" \
                  '.displayName = ("diag-beta-specific-pt2h-" + $runId) | .expiration.duration = "PT2H"')

                specific_pt2h_with_question_body=$(printf '%s' "${specific_pt2h_no_question_body}" | jq \
                  '.questions = [
                    {
                      "@odata.type": "#microsoft.graph.accessPackageTextInputQuestion",
                      isRequired: true,
                      isAnswerEditable: true,
                      sequence: 0,
                      text: {
                        defaultText: "Halo ID (include all changes being executed)"
                      }
                    }
                  ]')

                current_beta_body=$(jq -n \
                  --arg packageId "${rd_package_id}" \
                  --arg requestorGroupId "${requestor_group_id}" \
                  --arg approverGroupId "${approver_group_id}" \
                  --arg runId "${run_id}" \
                  '{
                    accessPackageId: $packageId,
                    displayName: ("diag-beta-current-" + $runId),
                    description: "Temporary beta policy diagnostic",
                    canExtend: false,
                    expiration: {
                      duration: "PT2H",
                      type: "afterDuration"
                    },
                    requestorSettings: {
                      scopeType: "SpecificDirectorySubjects",
                      acceptRequests: true,
                      allowedRequestors: [
                        {
                          "@odata.type": "#microsoft.graph.groupMembers",
                          id: $requestorGroupId,
                          isBackup: false
                        }
                      ]
                    },
                    requestApprovalSettings: {
                      isApprovalRequired: true,
                      isApprovalRequiredForExtension: false,
                      isRequestorJustificationRequired: true,
                      approvalMode: "SingleStage",
                      approvalStages: [
                        {
                          approvalStageTimeOutInDays: 1,
                          isApproverJustificationRequired: false,
                          isEscalationEnabled: false,
                          primaryApprovers: [
                            {
                              "@odata.type": "#microsoft.graph.groupMembers",
                              id: $approverGroupId,
                              isBackup: false
                            }
                          ],
                          fallbackPrimaryApprovers: [],
                          escalationApprovers: [],
                          fallbackEscalationApprovers: []
                        }
                      ]
                    },
                    questions: [
                      {
                        "@odata.type": "#microsoft.graph.accessPackageTextInputQuestion",
                        isRequired: true,
                        isAnswerEditable: true,
                        sequence: 0,
                        text: {
                          defaultText: "Halo ID (include all changes being executed)"
                        }
                      }
                    ]
                  }')

                try_beta_policy "provider-style-p90-groupId" "${provider_style_body}"
                try_beta_policy "specific-p1d-groupId-no-question" "${specific_p1d_no_question_body}"
                try_beta_policy "specific-pt2h-groupId-no-question" "${specific_pt2h_no_question_body}"
                try_beta_policy "specific-pt2h-groupId-with-question" "${specific_pt2h_with_question_body}"
                try_beta_policy "current-pt2h-id-with-question" "${current_beta_body}"

          - template: steps/terraform.yaml@cnp-azuredevops-libraries
            parameters:
              location: ${{ parameters.location }}
              serviceConnection: ${{ variables.serviceConnection }}
              product: ${{ variables.product }}
              overrideAction: ${{ parameters.overrideAction }}
              environment: ${{ variables.environment }}
              component: "access-packages"
              terraformInitSubscription: ${{ variables.terraformInitSubscription }}
              tfVarsFile: NULL
              terraformEnvironmentVariables:
                ARM_CLIENT_ID: ${{ variables.client_id }}
                ARM_CLIENT_SECRET: $(access-packages-secret)
                ARM_TENANT_ID: ${{ variables.tenant_id }}
                ARM_USE_CLI: "false"
              initCommandOptions: >
                -reconfigure
                -var subscription_id=${{ variables.terraformSubscriptionID }}
              planCommandOptions: >
                -var subscription_id=${{ variables.terraformSubscriptionID }}
                -var env=${{ variables.environment }}
                -var client_id=${{ variables.client_id }}
                -var client_secret=$(access-packages-secret)
                -var tenant_id=${{ variables.tenant_id }}
